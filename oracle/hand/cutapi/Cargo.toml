[package]
name = "cutapi"
version = "0.1.0"
edition = "2021"

# The sandbox API of the region cutter (CUTTER.md 12.12): the only crate a worker's region module can see. It depends on the
# same ee-oracle (same path string as ee-hand) so `Ctx` wraps the very `Cpu` the dispatcher runs.
[dependencies]
ee-oracle = { path = "../.." }

[lints.rust]
unsafe_code = "forbid"
