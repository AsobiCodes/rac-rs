# Builds rac-rs in a Debian 12 container that already has everything the build
# needs. Nothing has to be installed on your machine: no Rust, no Python, no C
# headers, and no fish.
#
#   cp /path/to/your-disc.iso rom/
#   sudo docker compose up
#
# The game folder is mounted at /src, so the build happens in place and the
# finished game lands in build/release/. The container runs as root, so it
# hands the files it created back to you when it is done.
#
# Debian 12 has an older C library than a current desktop, so the game it
# builds also runs on older systems, a Steam Deck included.

name: rac-rs-linux-build

services:
  build:
    image: rust:1.99-bookworm
    working_dir: /src
    volumes:
      - type: bind
        source: .
        target: /src
    environment:
      CARGO_BUILD_JOBS: "${CARGO_BUILD_JOBS:-8}"
    command:
      - bash
      - -c
      - |
        trap 'chown -R $(stat -c %u /src):$(stat -c %g /src) /src' EXIT
        apt-get update && apt-get install -y --no-install-recommends python3 build-essential pkg-config libasound2-dev libudev-dev || exit 1
        ./setup.sh --no-pause
