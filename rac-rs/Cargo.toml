[package]
name = "rac-rs"
version = "0.1.0"
edition = "2024"
# The game as a library (src/lib.rs, crate rac_game) without the generated game code; the exe `rac-rs` is built by the package in
# exe/ (rac-rs-exe), which adds ee-game. Kept apart so this crate compiles in parallel with the generated crates.
autobins = false

[lib]
name = "rac_game"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
cpal = "0.18.2"
pollster = "1.0.1"
rayon = "1.12.0"
wgpu = "30.0.1"
winit = "0.30.13"
ee-oracle = { path = "../oracle" }

# Linux: the gamepads (an Xbox controller, a DualSense, ...) as evdev devices, read with gilrs. The Windows build has its own
# paths (xinput for an Xbox controller, pspad for a PlayStation one) and does not need this.
# The default features (gilrs' `wgi`) are kept: gilrs-core insists on one of `wgi` / `xinput` being enabled on every platform, and
# the `windows` crate behind `wgi` is an empty stub outside Windows, so it costs nothing here.
  [target.'cfg(target_os = "linux")'.dependencies]
  gilrs = { version = "0.11.2" }
  # The run log (runlog.rs) sends the game's stderr into the log file through a pipe: pipe, dup2 and read.
  libc = "0.2.190"

[features]
# Public build: the exe uses the Windows GUI subsystem (no console window) and logs panics to <player dir>/crash.log. Off for dev builds and test tools.
windows_gui = []

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
ee_game_for_tests = { package = "ee-game", path = "../oracle/game" }
