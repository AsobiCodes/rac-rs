[package]
name = "rac-rs-launcher"
version = "0.4.0"
edition = "2021"
description = "RAC-RS Launcher for Linux: install, play, configure and update the Ratchet & Clank PC port"
license = "GPL-3.0-or-later"

[lib]
name = "rac_rs_launcher"
path = "src/lib.rs"

[[bin]]
name = "rac-rs-launcher"
path = "src/main.rs"

[dependencies]
egui = { version = "0.37.0", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
trash = "5.2.9"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.5.0", default-features = false, features = ["gzip", "rustls"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }

# This tree is the Linux launcher. The Windows build (PowerShell worker, resource
# embedding, shortcuts) is archived in windows/ for reference and is not built.
[workspace]
